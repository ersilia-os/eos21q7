Title: 'InterDILI: drug-induced injury prediction'
Description: Flags the risk that a compound causes drug-induced liver injury, 
  the leading cause of safety-driven withdrawals from the market. Lee and Yoo 
  built InterDILI from substructure and physicochemical descriptors combined 
  with an attention mechanism and permutation feature importance, so the 
  features behind each call can be inspected, reporting AUROC between 0.88 and 
  0.97 across five public DILI datasets. Ersilia replicates it with a classifier
  trained on the merged 1850-compound set, reaching an AUROC of 0.86 in 
  five-fold cross-validation.
